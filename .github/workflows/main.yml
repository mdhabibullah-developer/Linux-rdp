name: Linux RDP (Debug Mode)

on:
  workflow_dispatch:

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Desktop Environment and XRDP
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          echo "xfce4-session" > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp

      - name: Setup User and Password
        shell: bash
        run: |
          PASSWORD=$(openssl rand -base64 12)
          echo "runner:$PASSWORD" | sudo chpasswd
          echo "::add-mask::$PASSWORD"
          echo "RDP_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        shell: bash
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          if ! command -v tailscale &> /dev/null; then
            echo "Tailscale installation failed!"
            exit 1
          fi
          echo "Tailscale installed successfully."

      - name: Establish Tailscale Connection
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # ১. সিক্রেট চেক
          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "----------------------------------------------------------------"
            echo "CRITICAL ERROR: TAILSCALE_AUTH_KEY is empty!"
            echo "Please go to: Settings -> Secrets and variables -> Actions"
            echo "Add a secret named 'TAILSCALE_AUTH_KEY' with your Tailscale key."
            echo "----------------------------------------------------------------"
            exit 1
          fi

          echo "Attempting to connect Tailscale..."
          
          # ২. টেলস্কেল আপ (ভারবোস মোডে যাতে এরর দেখা যায়)
          # --ephemeral ব্যবহার করা হয়েছে যাতে ডিভাইস লিস্ট পরিষ্কার থাকে
          sudo tailscale up --authkey=$TAILSCALE_AUTH_KEY --hostname=gh-linux-debug-$GITHUB_RUN_ID 2>&1 | tee tailscale_log.txt

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Tailscale 'up' command failed. Checking logs..."
            cat tailscale_log.txt
            exit 1
          fi

          # ৩. আইপি পাওয়ার জন্য অপেক্ষা
          TS_IP=""
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4)
            if [[ $TS_IP =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tailscale connected! IP: $TS_IP"
              break
            fi
            echo "Waiting for IP... ($i/15)"
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale connected but no IP assigned."
            sudo tailscale status
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Connection Details
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "  LINUX RDP ACCESS"
          echo "  Address : $TAILSCALE_IP"
          echo "  Username: runner"
          echo "  Password: $RDP_PASSWORD"
          echo "=========================================="
          echo ""

      - name: Maintain Connection
        shell: bash
        run: |
          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Linux RDP Active"
            sleep 300
          done
