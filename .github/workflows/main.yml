name: Linux RDP (Fixed Login)

on:
  workflow_dispatch:

jobs:
  linux-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Desktop Environment and XRDP
        shell: bash
        run: |
          sudo apt-get update
          # XFCE4 এবং XRDP ইনস্টল
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          
          # XRDP-কে ssl-cert গ্রুপে যুক্ত করা (এটি না করলে অনেক সময় লগইন ফেইল করে)
          sudo adduser xrdp ssl-cert
          
          # XFCE সেশন কনফিগারেশন (সরাসরি runner ইউজারের হোম ডিরেক্টরিতে)
          echo "xfce4-session" | sudo tee /home/runner/.xsession
          sudo chown runner:runner /home/runner/.xsession
          
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          echo "Desktop environment and XRDP installed and configured."

      - name: Setup User and Password
        shell: bash
        run: |
          # শক্তিশালী র্যান্ডম পাসওয়ার্ড
          PASSWORD=$(openssl rand -base64 12)
          
          # runner ইউজারের পাসওয়ার্ড সেট করা
          echo "runner:$PASSWORD" | sudo chpasswd
          
          # পাসওয়ার্ড মাস্কিং
          echo "::add-mask::$PASSWORD"
          echo "RDP_PASSWORD=$PASSWORD" >> $GITHUB_ENV
          
          echo "User password configured."

      - name: Install Tailscale
        shell: bash
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "Error: TAILSCALE_AUTH_KEY secret is missing!"
            exit 1
          fi

          sudo tailscale up --authkey=$TAILSCALE_AUTH_KEY --hostname=gh-linux-fixed-$GITHUB_RUN_ID 2>&1 | tee tailscale_log.txt

          TS_IP=""
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4)
            if [[ $TS_IP =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              break
            fi
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Error: Tailscale IP not assigned."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Connection Details
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "  LINUX RDP ACCESS (FIXED)"
          echo "  Address : $TAILSCALE_IP"
          echo "  Username: runner"
          echo "  Password: $RDP_PASSWORD"
          echo "=========================================="
          echo ""

      - name: Maintain Connection
        shell: bash
        run: |
          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Linux RDP Active"
            sleep 300
          done
